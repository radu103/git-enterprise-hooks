version: 2

project_name: git-enterprise-hooks

builds:
  - id: cli
    main: .
    binary: git-enterprise-hooks
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: release-artifacts
    ids:
      - cli
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: binary

checksum:
  name_template: checksums.txt

release:
  github:
    owner: radu103
    name: git-enterprise-hooks
  prerelease: auto

nfpms:
  - id: deb
    package_name: git-enterprise-hooks
    file_name_template: "{{ .ConventionalFileName }}"
    homepage: "https://github.com/radu103/git-enterprise-hooks"
    maintainer: "radu103"
    description: "CLI helper that installs a pre-commit hook and guides task-based commit message creation."
    license: "MIT"
    formats:
      - deb
    bindir: /usr/bin
    builds:
      - cli

brews:
  - name: git-enterprise-hooks
    repository:
      owner: radu103
      name: homebrew-git-enterprise-hooks
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/radu103/git-enterprise-hooks"
    description: "CLI helper that installs a pre-commit hook and guides task-based commit message creation."
    license: "MIT"
    install: |
      bin.install "git-enterprise-hooks"
    test: |
      system "#{bin}/git-enterprise-hooks", "--help"

scoops:
  - name: git-enterprise-hooks
    repository:
      owner: radu103
      name: scoop-bucket
      branch: main
      token: "{{ .Env.SCOOP_BUCKET_GITHUB_TOKEN }}"
    homepage: "https://github.com/radu103/git-enterprise-hooks"
    description: "CLI helper that installs a pre-commit hook and guides task-based commit message creation."
    license: "MIT"

winget:
  - name: git-enterprise-hooks
    publisher: radu103
    short_description: CLI helper for enterprise pre-commit hook workflows
    license: MIT
    homepage: "https://github.com/radu103/git-enterprise-hooks"
    package_identifier: Radu103.GitEnterpriseHooks
    repository:
      owner: microsoft
      name: winget-pkgs
      branch: master
      token: "{{ .Env.WINGET_GITHUB_TOKEN }}"
    url_template: "https://github.com/radu103/git-enterprise-hooks/releases/download/{{ .Tag }}/git-enterprise-hooks_{{ .Version }}_windows_{{ .Arch }}.exe"
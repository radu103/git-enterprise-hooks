name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          SCOOP_BUCKET_GITHUB_TOKEN: ${{ secrets.SCOOP_BUCKET_GITHUB_TOKEN }}
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}

      - name: Publish deb packages to Cloudsmith (optional)
        if: ${{ secrets.CLOUDSMITH_API_KEY != '' && secrets.CLOUDSMITH_OWNER != '' && secrets.CLOUDSMITH_REPO != '' }}
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
          CLOUDSMITH_OWNER: ${{ secrets.CLOUDSMITH_OWNER }}
          CLOUDSMITH_REPO: ${{ secrets.CLOUDSMITH_REPO }}
          CLOUDSMITH_DIST: ${{ secrets.CLOUDSMITH_DIST }}
          CLOUDSMITH_COMPONENT: ${{ secrets.CLOUDSMITH_COMPONENT }}
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install cloudsmith-cli
          DIST="${CLOUDSMITH_DIST:-any-distro}"
          COMPONENT="${CLOUDSMITH_COMPONENT:-main}"
          for f in dist/*.deb; do
            cloudsmith push deb "${CLOUDSMITH_OWNER}/${CLOUDSMITH_REPO}/${DIST}/${COMPONENT}" "$f"
          done
